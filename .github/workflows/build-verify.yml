name: Build verification

# Single source of truth for build confirmation. Called by `pr_acceptance.yml` (on PRs) and
# `build_deploy.yml` (before publishing on a tag) via `uses:` so the steps live in ONE place and
# can't drift between workflows.
#
# Shape: one fast `test` job (Dart unit tests are MethodChannel-mocked, so platform-agnostic — run
# once, not per build), then the platform builds gated behind it (`needs: [test]`) so the slow /
# expensive builds (especially macOS) don't run when the Dart layer is broken.
on:
  workflow_call:

jobs:
  test:
    name: Dart tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Flutter pub get (root)
        run: flutter pub get

      - name: Flutter test (root)
        run: flutter test

      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      - name: Flutter test (example)
        working-directory: example
        run: flutter test

  android:
    name: Android example — ${{ matrix.label }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only the experimental (AGP 9) cell is allowed to fail; the floor/stable cells gate.
    continue-on-error: ${{ matrix.experimental || false }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Support floor — guards against breaking the minimum Flutter SDK. Exercises the
          # plugin's `agpMajor < 9` path on the oldest supported toolchain.
          - label: "Flutter 3.41 (floor)"
            flutter: "3.41.0"
          # Current default toolchain — where #492 reproduced (AGP < 9 path + Built-in Kotlin scan).
          - label: "Flutter stable"
            flutter: ""
          # Forward-looking — AGP 9 enables Built-in Kotlin, which supplies KGP and exercises the
          # plugin's `agpMajor >= 9` branch. Allowed to fail until the AGP 9 toolchain stabilises.
          - label: "Flutter stable + AGP 9 (experimental)"
            flutter: ""
            agp9: true
            experimental: true
    env:
      CI: true
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false -Dorg.gradle.caching=true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            example/android/**/*.gradle*
            example/android/**/gradle-wrapper.properties
            example/android/gradle.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Empty string → latest of the channel; otherwise pin to the floor version.
          flutter-version: ${{ matrix.flutter }}
          cache: true

      - run: flutter --version

      - name: Switch example to the AGP 9 toolchain (experimental cell)
        if: ${{ matrix.agp9 }}
        run: |
          set -euxo pipefail
          # AGP 9.1.1 requires Gradle >= 9.3.1 and enables Built-in Kotlin by default, so the
          # example app must no longer apply kotlin-android (Flutter supplies KGP). Migrating it
          # here lets this cell exercise the plugin's `agpMajor >= 9` branch end to end.
          sed -i 's#com.android.tools.build:gradle:8.13.0#com.android.tools.build:gradle:9.1.1#' example/android/build.gradle
          sed -i 's#com.android.application" version "8.13.0"#com.android.application" version "9.1.1"#' example/android/settings.gradle
          sed -i 's#gradle-8.14.6-bin.zip#gradle-9.3.1-bin.zip#' example/android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/id "kotlin-android"/d' example/android/app/build.gradle
          sed -i '/kotlinOptions {/,/}/d' example/android/app/build.gradle

      - name: Flutter pub get (root)
        run: flutter pub get

      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      - name: Build example APK (debug, verbose)
        working-directory: example
        run: flutter build apk --debug -v

  ios:
    name: iOS example
    needs: [test]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CI: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      # The example app integrates the plugin via CocoaPods. Flutter's SPM auto-integration fails
      # here because the checkout directory (flutter_facebook_app_events) differs from the plugin's
      # Swift package identity (facebook_app_events); this only affects local checkouts, not
      # pub.dev consumers (where the package dir matches). Build via CocoaPods.
      - name: Disable Swift Package Manager (example builds via CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      # Only the pod download cache is cached. ~/.cocoapods holds the trunk CDN version index,
      # which `pod install` (without --repo-update) trusts as-is when present, so caching it
      # would freeze resolution at whatever 19.x patch existed when the cache was saved.
      # example/ios/Pods is rebuilt by `pod install` every run (no lockfile), so restoring it
      # buys nothing.
      - name: Cache CocoaPods downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          # example/ios/Podfile.lock is not committed; key on the inputs that drive resolution.
          key: ${{ runner.os }}-cocoapods-downloads-${{ hashFiles('ios/facebook_app_events.podspec', 'example/ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-downloads-

      - name: Cache CocoaPods gem
        uses: actions/cache@v6
        with:
          path: ~/.gem
          key: ${{ runner.os }}-cocoapods-gem-v1

      - name: Add user gem bin to PATH
        run: echo "$(ruby -r rubygems -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Install CocoaPods
        run: gem list -i cocoapods || gem install cocoapods -N --user-install

      - name: Flutter pub get (root)
        run: flutter pub get

      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      - name: Build example iOS (no-codesign, verbose)
        working-directory: example
        run: flutter build ios --no-codesign -v

      # example/ios/Podfile.lock is deliberately not committed (see example/ios/.gitignore), so
      # each run resolves the newest Facebook SDK in range. This artifact is the only record of
      # which pod versions a given run built against.
      - name: Upload resolved Podfile.lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: example-ios-podfile-lock
          path: example/ios/Podfile.lock
          if-no-files-found: ignore

  # The `ios` job above builds through CocoaPods, so the plugin's Package.swift is only exercised
  # here. Covers the floor because 3.41 is the first Flutter release that generates the local
  # `FlutterFramework` package the manifest depends on (#514), and stable because newer Flutter
  # versions warn about plugins that are missing that dependency.
  ios-spm:
    name: iOS example (Swift Package Manager) — ${{ matrix.label }}
    needs: [test]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Flutter 3.41 (floor)"
            flutter: "3.41.0"
          - label: "Flutter stable"
            flutter: ""
    env:
      CI: true
    defaults:
      run:
        working-directory: facebook_app_events

    steps:
      # Check out into `facebook_app_events` so the plugin's SwiftPM symlink has the same name on
      # every Flutter version in the matrix. Flutter 3.41 names it after the pubspec name; 3.44+
      # name it after the plugin's root directory (for pub.dev installs that is
      # `facebook_app_events-<version>`). The `test -L` assertion below relies on this name.
      - uses: actions/checkout@v7
        with:
          path: facebook_app_events

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Empty string → latest of the channel; otherwise pin to the floor version.
          flutter-version: ${{ matrix.flutter }}
          cache: true

      - run: flutter --version

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Flutter pub get (root)
        run: flutter pub get

      - name: Flutter pub get (example)
        working-directory: facebook_app_events/example
        run: flutter pub get

      - name: Build example iOS (no-codesign, verbose)
        working-directory: facebook_app_events/example
        run: |
          set -o pipefail
          flutter build ios --no-codesign -v 2>&1 | tee "$RUNNER_TEMP/build-ios.log"

      - name: Confirm the plugin was integrated through Swift Package Manager
        working-directory: facebook_app_events/example
        run: |
          set -euo pipefail
          test -L ios/Flutter/ephemeral/Packages/.packages/facebook_app_events
          test -f ios/Flutter/ephemeral/Packages/.packages/FlutterFramework/Package.swift
          grep -q 'FlutterGeneratedPluginSwiftPackage' ios/Runner.xcodeproj/project.pbxproj

      # Flutter only prints this warning (it does not fail the build), so check for it explicitly.
      # Runs even if an earlier step failed, so the specific error still shows up in that case.
      # test/ios_package_swift_test.dart is the primary guard; this catches Flutter-side changes.
      - name: Fail on Flutter's missing-FlutterFramework warning
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f "$RUNNER_TEMP/build-ios.log" ]; then
            echo "No build log; the build step did not run."
            exit 0
          fi
          if grep -n 'missing a dependency on FlutterFramework' "$RUNNER_TEMP/build-ios.log"; then
            echo "::error::Package.swift is missing the FlutterFramework dependency"
            exit 1
          fi
