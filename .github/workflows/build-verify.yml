name: Build verification

# Single source of truth for build confirmation. Called by `pr_acceptance.yml` (on PRs) and
# `build_deploy.yml` (before publishing on a tag) via `uses:` so the steps live in ONE place and
# can't drift between workflows.
#
# Shape: one fast `test` job (Dart unit tests are MethodChannel-mocked, so platform-agnostic — run
# once, not per build), then the platform builds gated behind it (`needs: [test]`) so the slow /
# expensive builds (especially macOS) don't run when the Dart layer is broken.
on:
  workflow_call:

jobs:
  test:
    name: Dart checks — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum Flutter the plugin supports, so the Dart layer and its tests are known
          # to work there and not only on the newest SDK.
          - label: "Flutter 3.41 (floor)"
            flutter: "3.41.0"
          - label: "Flutter stable"
            flutter: ""
            format: true
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Empty string → latest of the channel; otherwise pin to the floor version.
          flutter-version: ${{ matrix.flutter }}
          # The Flutter SDK is deliberately not cached (`cache: true`): each copy is 1.6-2 GB,
          # which filled the repo's 10 GB Actions cache quota, and a fresh download takes about
          # as long as restoring it.

      - run: flutter --version

      - name: Flutter pub get (root)
        run: flutter pub get

      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      # One formatter version only: output can differ between Dart releases, and stable is
      # what contributors run.
      - name: Check formatting
        if: ${{ matrix.format }}
        run: dart format --output=none --set-exit-if-changed .

      # Covers the package and the example (both resolved above). Warnings and errors fail the
      # job; infos do not, because they include deprecations that differ per Flutter version
      # (3.50 deprecates `package:flutter/material.dart`, whose replacement the floor lacks).
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter test (root)
        run: flutter test

      - name: Flutter test (example)
        working-directory: example
        run: flutter test

  android:
    name: Android example — ${{ matrix.label }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Support floor — guards against breaking the minimum Flutter SDK. The example is
          # committed on the AGP 9 toolchain that current Flutter requires, so this cell switches
          # it back to AGP 8 and exercises the plugin's `agpMajor < 9` path, where the plugin
          # applies the Kotlin Gradle Plugin itself.
          - label: "Flutter 3.41 (floor, AGP 8)"
            flutter: "3.41.0"
            agp8: true
          # Current default toolchain, example as committed: AGP 9 with the Flutter app template's
          # `android.builtInKotlin=false`, so the Flutter Gradle Plugin applies KGP to the plugin.
          - label: "Flutter stable"
            flutter: ""
          # AGP 9 defaults (no `android.builtInKotlin`/`android.newDsl` overrides), as in an app
          # migrated to Built-in Kotlin: AGP supplies Kotlin to the plugin.
          - label: "Flutter stable + Built-in Kotlin"
            flutter: ""
            builtInKotlin: true
    env:
      CI: true
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false -Dorg.gradle.caching=true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            example/android/**/*.gradle*
            example/android/**/gradle-wrapper.properties
            example/android/gradle.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Empty string → latest of the channel; otherwise pin to the floor version.
          flutter-version: ${{ matrix.flutter }}

      - run: flutter --version

      - name: Install the NDK that Flutter asks for (with retries)
        run: |
          set -euo pipefail
          # The runner image does not ship the NDK version Flutter pins, so AGP downloads it
          # during the build, in a single attempt. A corrupt download then fails the job with
          # "Error reading Zip content from a SeekableByteChannel". Install it here instead,
          # where a bad download can be thrown away and retried.
          flutter_root="$(flutter --version --machine | jq -r .flutterRoot)"
          ndk="$(sed -nE 's/.*ndkVersion: String = "([0-9.]+)".*/\1/p' \
            "$flutter_root/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" | head -n1)"
          if [ -z "$ndk" ]; then
            echo "::warning::Could not read Flutter's NDK version; leaving the NDK install to the build."
            exit 0
          fi
          ndk_dir="$ANDROID_HOME/ndk/$ndk"
          for attempt in 1 2 3; do
            if [ -f "$ndk_dir/source.properties" ]; then
              echo "NDK $ndk is installed."
              exit 0
            fi
            echo "Installing NDK $ndk (attempt $attempt of 3)"
            rm -rf "$ndk_dir"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null || true
          done
          [ -f "$ndk_dir/source.properties" ] || { echo "::error::NDK $ndk could not be installed"; exit 1; }

      - name: Switch example back to the AGP 8 toolchain (floor cell)
        if: ${{ matrix.agp8 }}
        run: |
          set -euxo pipefail
          # Flutter 3.41 predates the AGP 9 requirement. Restore the AGP 8.13.0 / Gradle 8.14.6
          # setup the example had before it moved to AGP 9: the app applies kotlin-android itself
          # and the AGP 9 flags are dropped. Each grep fails the step if a sed stops matching.
          sed -i 's#com.android.tools.build:gradle:9.3.1#com.android.tools.build:gradle:8.13.0#' example/android/build.gradle
          grep -q 'com.android.tools.build:gradle:8.13.0' example/android/build.gradle
          sed -i 's#com.android.application" version "9.3.1"#com.android.application" version "8.13.0"#' example/android/settings.gradle
          grep -q 'com.android.application" version "8.13.0"' example/android/settings.gradle
          sed -i 's#gradle-9.5.0-bin.zip#gradle-8.14.6-bin.zip#' example/android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'gradle-8.14.6-bin.zip' example/android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/^android.newDsl=/d;/^android.builtInKotlin=/d' example/android/gradle.properties
          sed -i 's#^    id "com.android.application"$#&\n    id "kotlin-android"#' example/android/app/build.gradle
          grep -q 'id "kotlin-android"' example/android/app/build.gradle
          printf '\nkotlin {\n    compilerOptions {\n        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17\n    }\n}\n' >> example/android/app/build.gradle

      - name: Switch example to AGP 9 Built-in Kotlin
        if: ${{ matrix.builtInKotlin }}
        run: |
          set -euxo pipefail
          sed -i '/^android.newDsl=/d;/^android.builtInKotlin=/d' example/android/gradle.properties
          if grep -qE '^android\.(newDsl|builtInKotlin)=' example/android/gradle.properties; then exit 1; fi

      - name: Flutter pub get (root)
        run: flutter pub get

      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      - name: Build example APK (debug, verbose)
        working-directory: example
        run: flutter build apk --debug -v

  ios:
    name: iOS example
    needs: [test]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CI: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version

      # This job covers the CocoaPods integration. Swift Package Manager is on by default from
      # Flutter 3.44, so turn it off to make the example build through CocoaPods.
      - name: Disable Swift Package Manager (example builds via CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      # Only the pod download cache is cached. ~/.cocoapods holds the trunk CDN version index,
      # which `pod install` (without --repo-update) trusts as-is when present, so caching it
      # would freeze resolution at whatever 19.x patch existed when the cache was saved.
      # example/ios/Pods is rebuilt by `pod install` every run (no lockfile), so restoring it
      # buys nothing.
      - name: Cache CocoaPods downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          # example/ios/Podfile.lock is not committed; key on the inputs that drive resolution.
          key: ${{ runner.os }}-cocoapods-downloads-${{ hashFiles('ios/facebook_app_events.podspec', 'example/ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-downloads-

      - name: Cache CocoaPods gem
        uses: actions/cache@v6
        with:
          path: ~/.gem
          key: ${{ runner.os }}-cocoapods-gem-v1

      - name: Add user gem bin to PATH
        run: echo "$(ruby -r rubygems -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Install CocoaPods
        run: gem list -i cocoapods || gem install cocoapods -N --user-install

      - name: Flutter pub get (root)
        run: flutter pub get

      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      - name: Build example iOS (no-codesign, verbose)
        working-directory: example
        run: flutter build ios --no-codesign -v

      # example/ios/Podfile.lock is deliberately not committed (see example/ios/.gitignore), so
      # each run resolves the newest Facebook SDK in range. This artifact is the only record of
      # which pod versions a given run built against.
      - name: Upload resolved Podfile.lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: example-ios-podfile-lock
          path: example/ios/Podfile.lock
          if-no-files-found: ignore

  # The `ios` job above builds through CocoaPods, so the plugin's Package.swift is only exercised
  # here. Covers the floor because 3.41 is the first Flutter release that generates the local
  # `FlutterFramework` package the manifest depends on (#514), and stable because newer Flutter
  # versions warn about plugins that are missing that dependency.
  ios-spm:
    name: iOS example (Swift Package Manager) — ${{ matrix.label }}
    needs: [test]
    runs-on: macos-latest
    timeout-minutes: 60
    # TEMPORARY: the probe cell is expected to fail; it only records where the Xcode floor is.
    continue-on-error: ${{ matrix.probe || false }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Flutter 3.41 (floor)"
            flutter: "3.41.0"
          - label: "Flutter stable"
            flutter: ""
          # The Facebook iOS SDK v19 ships Swift interfaces that only Swift 6.3+ can read, so
          # the plugin needs Xcode 26.4 or newer. The other cells use the runner's newest Xcode;
          # this one keeps the documented minimum building.
          - label: "Flutter stable, Xcode 26.4 (minimum)"
            flutter: ""
            xcode: "26.4"
          # TEMPORARY probe, removed once its result is recorded.
          - label: "Flutter stable, Xcode 26.3 (probe, expected to fail)"
            flutter: ""
            xcode: "26.3"
            probe: true
    env:
      CI: true
    defaults:
      run:
        working-directory: facebook_app_events

    steps:
      # Check out into `facebook_app_events` so the plugin's SwiftPM symlink has the same name on
      # every Flutter version in the matrix. Flutter 3.41 names it after the pubspec name; 3.44+
      # name it after the plugin's root directory (for pub.dev installs that is
      # `facebook_app_events-<version>`). The `test -L` assertion below relies on this name.
      - uses: actions/checkout@v7
        with:
          path: facebook_app_events

      - name: Select Xcode ${{ matrix.xcode }}
        if: ${{ matrix.xcode }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Empty string → latest of the channel; otherwise pin to the floor version.
          flutter-version: ${{ matrix.flutter }}

      - run: flutter --version

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Flutter pub get (root)
        run: flutter pub get

      - name: Flutter pub get (example)
        working-directory: facebook_app_events/example
        run: flutter pub get

      - name: Build example iOS (no-codesign, verbose)
        working-directory: facebook_app_events/example
        run: |
          set -o pipefail
          flutter build ios --no-codesign -v 2>&1 | tee "$RUNNER_TEMP/build-ios.log"

      - name: Confirm the plugin was integrated through Swift Package Manager
        working-directory: facebook_app_events/example
        run: |
          set -euo pipefail
          test -L ios/Flutter/ephemeral/Packages/.packages/facebook_app_events
          test -f ios/Flutter/ephemeral/Packages/.packages/FlutterFramework/Package.swift
          grep -q 'FlutterGeneratedPluginSwiftPackage' ios/Runner.xcodeproj/project.pbxproj

      # Flutter only prints this warning (it does not fail the build), so check for it explicitly.
      # Runs even if an earlier step failed, so the specific error still shows up in that case.
      # test/ios_package_swift_test.dart is the primary guard; this catches Flutter-side changes.
      - name: Fail on Flutter's missing-FlutterFramework warning
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f "$RUNNER_TEMP/build-ios.log" ]; then
            echo "No build log; the build step did not run."
            exit 0
          fi
          if grep -n 'missing a dependency on FlutterFramework' "$RUNNER_TEMP/build-ios.log"; then
            echo "::error::Package.swift is missing the FlutterFramework dependency"
            exit 1
          fi
