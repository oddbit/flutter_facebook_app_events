name: Main verification

# Runs the build verification on every push to `main`. Besides confirming that `main` builds
# after a merge, this is what makes the Actions caches useful: a cache saved by a pull request
# run can only be read by that pull request, while a cache saved on the default branch can be
# read by every pull request.
on:
  push:
    branches:
      - main

# Never cancel a run on main half way: it is the one that saves the shared caches. Runs for
# later pushes wait their turn.
concurrency:
  group: main-verify
  cancel-in-progress: false

jobs:
  build-verify:
    uses: ./.github/workflows/build-verify.yml
