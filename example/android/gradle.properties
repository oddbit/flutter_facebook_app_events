org.gradle.jvmargs=-Xmx4096m
android.useAndroidX=true
android.enableJetifier=true
# The two flags below are what the Flutter 3.50 app template sets for AGP 9: the app keeps the
# old AGP DSL and does not use AGP's built-in Kotlin, so the Flutter Gradle Plugin applies the
# Kotlin Gradle Plugin (declared in settings.gradle) to the app and to plugins.
android.newDsl=false
android.builtInKotlin=false
