name: facebook_app_events
description: Flutter plugin for Meta's Facebook App Events SDK. Log app events on
  Android and iOS for ads measurement, attribution and audiences.
version: 0.33.0
homepage: https://oddb.it/app-events-pubspec
repository: https://github.com/oddbit/flutter_facebook_app_events

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: id.oddbit.flutter.facebook_app_events
        pluginClass: FacebookAppEventsPlugin
      ios:
        pluginClass: FacebookAppEventsPlugin
